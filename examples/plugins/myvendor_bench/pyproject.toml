[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myvendor-bench"
version = "0.1.0"
description = "Example Colosseum extension (reference skeleton)"
requires-python = ">=3.9"
dependencies = ["colosseum"]

[project.entry-points."colosseum.plugins"]
myvendor = "myvendor_bench:register"

[project.entry-points."colosseum.docgen"]
myvendor = "myvendor_bench.docgen_entry:spec"

[tool.setuptools.packages.find]
include = ["myvendor_bench*"]
