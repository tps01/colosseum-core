# Bench config for Yocto QEMU regression (host SSH to guest on port 2222).
# Duplicate of infra/yocto/conf/bench.qemu.toml for example scripts that load
# examples/configs/${COLOSSEUM_BENCH_CONFIG}.

[shared.ssh]
ssh_id = 1
host = "127.0.0.1"
port = 2222
username = "root"
password = ""
timeout = 60.0
