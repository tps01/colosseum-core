[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-core"
version = "0.15.0"
description = "Colosseum test automation framework (core runtime)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "tomli; python_version < '3.11'",
  "typing_extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
gui = ["customtkinter>=5.2"]
minimal = []
test = [
  "pytest>=8.0",
]
docs = ["sphinx>=7.0"]
static = [
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
]
# Integration extras: install sibling first-party plugins when developing the hub.
plugins = [
  "colosseum-shared>=0.1,<0.2",
  "colosseum-host>=0.1,<0.2",
  "colosseum-equipment>=0.1,<0.2",
]
bench = [
  "colosseum-shared[ssh]>=0.1,<0.2",
  "colosseum-host>=0.1,<0.2",
  "colosseum-equipment[hardware,plot]>=0.1,<0.2",
  "customtkinter>=5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
markers = [
    "requirement(id): traceability to test-plan requirement ID",
    "visa_sim: requires pyvisa-sim via colosseum-equipment[test] (Python 3.10+)",
    "gui: requires display, tkinter, and the colosseum-core[gui] extra",
    "plot: requires matplotlib save_plot path (slower)",
]

[project.entry-points."colosseum.docgen"]
colosseum = "colosseum.docgen_entry:spec"

[project.scripts]
colosseum = "colosseum.runner.cli:main"

[tool.setuptools.packages.find]
include = ["colosseum*"]
exclude = ["colosseum_equipment*", "colosseum_shared*", "colosseum_host*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "customtkinter.*",
  "tkinter.*",
  "sphinx.*",
  "pytest",
  "tomli",
  "tomllib",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
