[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum"
version = "0.12.2"
description = "Colosseum test automation framework (core + bench plugins)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "tomli; python_version < '3.11'",
  "typing_extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
hardware = [
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyserial",
]
ssh = ["paramiko"]
gui = ["customtkinter>=5.2"]
plot = ["matplotlib"]
minimal = []
test = [
  "pytest>=8.0",
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyvisa-sim>=0.7,<0.8; python_version >= '3.10'",
]
docs = ["sphinx>=7.0"]
mutation = [
  "cosmic-ray>=8.4,<9",
]
io = ["pyftdi>=0.55"]
# Compatibility aliases for prior broad extras.
equipment = [
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyserial",
  "matplotlib",
]
shared = ["paramiko"]
bench = [
  "pyvisa>=1.15; python_version >= '3.10'",
  "pyvisa>=1.14,<1.15; python_version < '3.10'",
  "pyserial",
  "paramiko",
  "customtkinter>=5.2",
  "matplotlib",
]
equipment-sim = ["pyvisa-sim>=0.7,<0.8; python_version >= '3.10'"]
static = [
  "bandit[toml]>=1.7",
  "vulture>=2.11",
  "ruff>=0.8",
  "mypy>=1.11",
  "types-paramiko",
  "types-pyserial",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
markers = [
    "requirement(id): traceability to test-plan requirement ID",
    "visa_sim: requires pyvisa-sim (.[test] extra; Python 3.10+)",
    "gui: requires display, tkinter, and the colosseum[gui] extra",
]

[project.entry-points."colosseum.docgen"]
colosseum = "colosseum.docgen_entry:spec"
equipment = "colosseum_equipment.docgen_entry:spec"
shared = "colosseum_shared.docgen_entry:spec"
host = "colosseum_host.docgen_entry:spec"

[project.scripts]
colosseum = "colosseum.runner.cli:main"

[project.entry-points."colosseum.plugins"]
equipment = "colosseum_equipment:register"
shared = "colosseum_shared:register"
host = "colosseum_host:register"

[tool.setuptools.packages.find]
include = ["colosseum*", "colosseum_equipment*", "colosseum_shared*", "colosseum_host*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["colosseum", "colosseum_equipment", "colosseum_shared", "colosseum_host", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum", "colosseum_equipment", "colosseum_shared", "colosseum_host"]
exclude = ["tests/", "build/", "examples/"]
strict = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "pyftdi.*",
  "scipy.*",
  "numpy.*",
  "matplotlib.*",
  "customtkinter.*",
  "tkinter.*",
  "pyvisa.*",
  "pyvisa_sim.*",
  "cosmic_ray.*",
  "sphinx.*",
  "pytest",
  "tomli",
  "tomllib",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs", "infra"]
