[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum-core"
version = "0.18.7"
description = "Colosseum test automation framework (core runtime)"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
  "tomli>=2.0,<3; python_version < '3.11'",
  "typing_extensions>=4.0,<5; python_version < '3.10'",
  "customtkinter>=5.2,<6",
  "PyYAML>=6.0,<7",
  "wakepy>=0.10",
  "pyinstaller>=6.22,<7",
  "pyinstaller-hooks-contrib>=2026.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
markers = [
    "requirement(id): traceability to test-plan requirement ID",
    "gui: requires display and tkinter",
]

[project.scripts]
colosseum = "colosseum.runner.cli:main"

[tool.setuptools.packages.find]
include = ["colosseum", "colosseum.*"]

[tool.setuptools.package-data]
colosseum = ["py.typed", "hooks/hook-colosseum.py"]
"colosseum.gui" = ["assets/*"]

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["colosseum", "scripts"]
exclude = ["colosseum/hooks"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["A", "BLE", "FBT", "N", "COM", "C4", "C901", "ISC", "ICN", "TID", "TCH", "E", "F", "W", "I", "B", "UP", "ANN", "ARG", "SIM", "RET", "PTH", "PLR1702", "PLR0914", "PLR0915", "PLR0912"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"colosseum/logging/__init__.py" = ["A005"]
"colosseum/gui/app.py" = ["E501", "FBT003", "ANN401"]
"colosseum/gui/_icon.py" = ["FBT003"]
"tests/**" = ["C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]
"scripts/**" = ["C901", "PLR0912", "PLR0914", "PLR0915", "PLR1702"]

[tool.mypy]
python_version = "3.12"
packages = ["colosseum"]
exclude = ["tests/", "build/", "examples/", "colosseum/hooks/"]
strict = true
warn_unused_ignores = true
show_error_codes = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "possibly-undefined", "ignore-without-code"]

[[tool.mypy.overrides]]
module = "scripts.*"
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
  "customtkinter.*",
  "tkinter.*",
  "sphinx.*",
  "pytest",
  "tomli",
  "tomllib",
  "yaml",
  "pyinstrument",
  "pyinstrument.*",
  "wakepy",
  "wakepy.*",
  "PyInstaller",
  "PyInstaller.*",
]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", "build", "examples", "docs"]
