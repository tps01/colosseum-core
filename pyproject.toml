[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colosseum"
version = "0.3.0"
description = "Colosseum test automation framework (core + bench plugins)"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "pyvisa>=1.15",
  "pyserial",
  "paramiko",
  "customtkinter>=5.2",
  "pyvisa-sim>=0.7,<0.8",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
minimal = []
test = ["pytest>=8.0"]
docs = ["sphinx>=7.0"]
mutation = [
  "cosmic-ray>=8.4,<9",
]
# Deprecated aliases (runtime deps are in core; removal planned for 0.4.0)
equipment = []
shared = []
bench = []
gui = []
equipment-sim = []

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/e2e"]
pythonpath = ["."]
markers = [
    "requirement(id): traceability to test-plan requirement ID",
    "visa_sim: requires pyvisa-sim (Python 3.10+)",
    "gui: requires display and tkinter (customtkinter is installed with colosseum)",
]

[project.entry-points."colosseum.docgen"]
colosseum = "colosseum.docgen_entry:spec"
equipment = "colosseum_equipment.docgen_entry:spec"
shared = "colosseum_shared.docgen_entry:spec"

[project.scripts]
colosseum = "colosseum.runner.cli:main"

[project.entry-points."colosseum.plugins"]
equipment = "colosseum_equipment:register"
shared = "colosseum_shared:register"

[tool.setuptools.packages.find]
include = ["colosseum*", "colosseum_equipment*", "colosseum_shared*"]
