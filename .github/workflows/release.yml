name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-offline-bundles:
    name: offline bundle (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -U pip setuptools wheel build
      - name: Build end-user offline bundle
        run: python scripts/package_offline.py
      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-offline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: colosseum-*-offline-*.tar.gz
          if-no-files-found: error

  build-sdist-wheel:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-dist
          path: dist/*
