# Cut a release: git tag v0.3.0 && git push origin v0.3.0
# Publishes wheel, sdist, offline bundles (py39/py311 × linux/windows), PDF, and HTML zip.
# workflow_dispatch builds the same artifacts without creating a GitHub Release (no tag).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdist-wheel:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-dist
          path: dist/*

  build-offline-bundles:
    name: offline bundle (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -U pip setuptools wheel build
      - name: Build end-user offline bundle
        run: python scripts/package_offline.py
      - name: Upload offline bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-offline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: colosseum-*-offline-*.tar.gz
          if-no-files-found: error

  build-docs:
    name: documentation (HTML + PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[docs,test]"
      - name: Install LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra zip
      - name: Build documentation
        run: python scripts/docgen/build_all.py
      - name: Archive HTML site
        run: |
          cd build/docgen/site/html
          zip -r "${GITHUB_WORKSPACE}/colosseum-docs-html.zip" .
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-docs
          path: |
            build/docgen/site/latex/*.pdf
            colosseum-docs-html.zip

  publish:
    name: publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-sdist-wheel, build-offline-bundles, build-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'^version = \"([^\"]+)\"', t, re.M).group(1))")"
          echo "Tag version: $TAG"
          echo "Package version: $VER"
          test "$TAG" = "$VER"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten release files
        run: |
          mkdir -p release-files
          find release-assets -type f \( \
            -name '*.whl' -o -name '*.tar.gz' -o -name '*.pdf' -o -name '*.zip' \
            \) -exec cp -t release-files {} +
          echo "Release assets:"
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Colosseum ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            - **Online:** `pip install` the `.whl` or sdist below.
            - **Air-gapped bench:** use `colosseum-*-offline-<platform>-pyXY.tar.gz` matching your OS and Python minor (`py39`, `py311`, …).
            - **Documentation:** `colosseum.pdf` (print/PDF) and `colosseum-docs-html.zip` (browse offline).

            Developers (pytest, docgen, PyVISA-sim): clone the repository and `pip install -r requirements-dev.txt` — not included in offline bundles.

            See [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#get-started) for full setup.
          files: release-files/*
          fail_on_unmatched_files: true
