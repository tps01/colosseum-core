# Tag vX.Y.Z on main (or workflow_dispatch for artifacts only).
# Thin orchestration: real logic lives in scripts/ci/ (GHA/Bamboo agnostic).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdist-wheel:
    name: sdist and wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: python scripts/ci/build_dist.py
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-dist
          path: dist/*
          if-no-files-found: error

  build-offline-wheelhouse:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu 24.04: ubuntu-latest (26.04) has no Python 3.9 builds.
        # ubuntu-24.04-arm produces linux-aarch64 offline houses.
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build offline wheelhouse archive
        run: python scripts/ci/build_offline_wheelhouse.py --archive
      - name: Upload offline wheelhouse
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            colosseum-core-offline-*.zip
            colosseum-core-offline-*.tar.gz
          if-no-files-found: error

  smoke-offline-install:
    name: offline install (${{ matrix.os }})
    needs: build-offline-wheelhouse
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.12"
            artifact: offline-ubuntu-24.04-py3.12
          - os: windows-latest
            python-version: "3.12"
            artifact: offline-windows-latest-py3.12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheelhouse
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: offline-smoke
      - name: Install with package indexes disabled and run a procedure
        shell: bash
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          archive=$(echo offline-smoke/*.tar.gz)
          mkdir -p offline-root
          tar -xzf "$archive" -C offline-root
          chmod +x offline-root/install.sh
          export PIP_NO_INDEX=1
          export PIP_INDEX_URL=http://127.0.0.1:9/simple
          unset PIP_EXTRA_INDEX_URL || true
          ./offline-root/install.sh
          work=$(mktemp -d)
          (
            cd "$work"
            env -u PYTHONPATH "$GITHUB_WORKSPACE/offline-root/.venv/bin/python" \
              -m colosseum.runner.cli run \
              "$GITHUB_WORKSPACE/tests/fixtures/scripts/pass_test.py" \
              --config "$GITHUB_WORKSPACE/tests/fixtures/core.toml"
            test -n "$(find outputs -name execution.sqlite -print -quit)"
          )
      - name: Install with package indexes disabled and run a procedure
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $archive = Get-ChildItem offline-smoke\*.zip | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath offline-root
          $env:PIP_NO_INDEX = '1'
          $env:PIP_INDEX_URL = 'http://127.0.0.1:9/simple'
          Remove-Item Env:PIP_EXTRA_INDEX_URL -ErrorAction SilentlyContinue
          cmd /c "offline-root\install.bat"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $work = Join-Path $env:TEMP "colosseum-offline-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $python = (Resolve-Path "offline-root\.venv\Scripts\python.exe").Path
          $env:PYTHONPATH = $null
          Push-Location $work
          try {
            & $python -m colosseum.runner.cli run "$env:GITHUB_WORKSPACE\tests\fixtures\scripts\pass_test.py" --config "$env:GITHUB_WORKSPACE\tests\fixtures\core.toml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Get-ChildItem outputs -Recurse -Filter execution.sqlite)) { throw "procedure wrote no database" }
          } finally {
            Pop-Location
          }

  smoke-frozen-executable:
    name: frozen executable smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core, the probe plugin, and test tools
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt
          # Non-editable: matches operator freeze installs (wheels), and avoids
          # relying solely on editable meta-path discovery during analysis.
          python -m pip install tests/fixtures/plugins/colosseum_contract_probe --no-deps
      - name: Freeze and run the probe contract
        run: |
          python -m colosseum.tools.build_executable
          export COLOSSEUM_FROZEN_EXECUTABLE="$PWD/dist/colosseum/colosseum"
          python -m pytest tests/e2e/test_plugin_contract.py::test_real_frozen_plugin_contract -q -p no:cacheprovider

  build-docs:
    name: documentation (HTML + PDF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -r requirements.txt
      - name: Cache LaTeX apt archives
        uses: actions/cache@v5
        with:
          path: .cache/apt/archives
          key: latex-release-ubuntu-${{ hashFiles('.github/workflows/release.yml') }}-v2
          restore-keys: latex-release-ubuntu-
      - name: Install LaTeX toolchain
        run: |
          mkdir -p "$PWD/.cache/apt/archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra zip
          sudo chown -R "$USER":"$USER" "$PWD/.cache/apt"
          rm -rf "$PWD/.cache/apt/archives/partial"
      - name: Build documentation
        run: python scripts/docgen/build_all.py
      - name: Archive HTML site
        run: |
          cd build/docgen/site/html
          zip -r "${GITHUB_WORKSPACE}/colosseum-docs-html.zip" .
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-docs
          path: |
            build/docgen/site/latex/*.pdf
            colosseum-docs-html.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-sdist-wheel, build-offline-wheelhouse, smoke-offline-install, smoke-frozen-executable, build-docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        run: python scripts/ci/verify_release_tag.py

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Flatten release files
        run: |
          mkdir -p release-files
          find release-assets -type f \( \
            -name '*.whl' -o -name '*.tar.gz' -o -name '*.pdf' -o -name '*.zip' \
            \) -exec cp -t release-files {} +
          echo "Release assets:"
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Colosseum Core ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install from release assets

            Download the wheel below and replace `<version>` with its version.

            ```bash
            python -m pip install "./colosseum_core-<version>-py3-none-any.whl"
            ```

            Or install the `.whl` / sdist attached below.

            ## Offline wheelhouses

            Use the archive matching your OS, **CPU arch**, and Python (3.9, 3.12, or 3.14).
            Wheels live under `wheels/`; operator scripts are at the archive root.

            - Windows: `colosseum-core-offline-windows-py*.zip` → `install.bat`, then `start_cli.bat`
            - Linux x86_64: `colosseum-core-offline-linux-x86_64-py*.tar.gz` → `./install.sh`
            - Linux aarch64: `colosseum-core-offline-linux-aarch64-py*.tar.gz` → `./install.sh`

            ```bash
            # Linux aarch64 example
            tar -xzf colosseum-core-offline-linux-aarch64-py<ver>.tar.gz -C wheelhouse
            cd wheelhouse && chmod +x install.sh start_*.sh && ./install.sh
            ```

            Core offline archives are headless. The optional desktop runner is the
            separate [`colosseum-ui`](https://github.com/tps01/colosseum-ui) package.

            Documentation: PDF and `colosseum-docs-html.zip`.
          files: release-files/*
          fail_on_unmatched_files: true
