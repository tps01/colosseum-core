# Cut a release: git tag v0.3.0 && git push origin v0.3.0
# Publishes the core wheel, sdist, PDF, and HTML documentation.
# workflow_dispatch builds the same artifacts without creating a GitHub Release (no tag).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sdist-wheel:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install -U pip setuptools wheel build
          python -m build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-dist
          path: dist/*
          if-no-files-found: error

  build-docs:
    name: documentation (HTML + PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[docs,test]"
      - name: Cache LaTeX apt archives
        uses: actions/cache@v5
        with:
          path: .cache/apt/archives
          key: latex-release-ubuntu-${{ hashFiles('.github/workflows/release.yml') }}-v2
          restore-keys: latex-release-ubuntu-
      - name: Install LaTeX toolchain
        run: |
          mkdir -p "$PWD/.cache/apt/archives/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra zip
          sudo chown -R "$USER":"$USER" "$PWD/.cache/apt"
          rm -rf "$PWD/.cache/apt/archives/partial"
      - name: Build documentation
        run: python scripts/docgen/build_all.py
      - name: Archive HTML site
        run: |
          cd build/docgen/site/html
          zip -r "${GITHUB_WORKSPACE}/colosseum-docs-html.zip" .
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: colosseum-docs
          path: |
            build/docgen/site/latex/*.pdf
            colosseum-docs-html.zip
          if-no-files-found: error

  publish:
    name: publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build-sdist-wheel, build-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import pathlib,re; t=pathlib.Path('pyproject.toml').read_text(); print(re.search(r'^version = \"([^\"]+)\"', t, re.M).group(1))")"
          echo "Tag version: $TAG"
          echo "Package version: $VER"
          test "$TAG" = "$VER"

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Flatten release files
        run: |
          mkdir -p release-files
          find release-assets -type f \( \
            -name '*.whl' -o -name '*.tar.gz' -o -name '*.pdf' -o -name '*.zip' \
            \) -exec cp -t release-files {} +
          echo "Release assets:"
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Colosseum ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Install

            - Install `colosseum-core` from the `.whl` or sdist below.
            - Install bench capabilities from their separate plugin distributions.
            - Documentation: `colosseum.pdf` and `colosseum-docs-html.zip`.

            See [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#install) for full setup.
          files: release-files/*
          fail_on_unmatched_files: true
