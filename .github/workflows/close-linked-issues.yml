# Close issues linked with Fixes/Closes/Resolves when a PR merges into develop.
# GitHub only auto-closes for the default branch (main); day-to-day work lands on develop.

name: Close linked issues

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const keyword =
              /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*(?:#|tps01\/colosseum-core#|https:\/\/github\.com\/tps01\/colosseum-core\/issues\/)(\d+)/gi;

            const chunks = [pr.title || "", pr.body || ""];
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            for (const commit of commits) {
              chunks.push(commit.commit?.message || "");
            }

            const found = new Set();
            for (const text of chunks) {
              for (const match of text.matchAll(keyword)) {
                found.add(Number(match[1]));
              }
            }

            if (found.size === 0) {
              core.info("No closing keywords found");
              return;
            }

            const prUrl = pr.html_url;
            for (const number of [...found].sort((a, b) => a - b)) {
              let issue;
              try {
                const response = await github.rest.issues.get({ owner, repo, issue_number: number });
                issue = response.data;
              } catch (error) {
                core.warning(`Skipping #${number}: ${error.message}`);
                continue;
              }
              if (issue.pull_request) {
                core.info(`Skipping #${number}: it is a pull request`);
                continue;
              }
              if (issue.state === "closed") {
                core.info(`Issue #${number} is already closed`);
                continue;
              }
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body: `Closed by ${prUrl} (merged into develop).`,
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`Closed issue #${number}`);
            }
