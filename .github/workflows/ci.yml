name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pin Ubuntu 24.04: ubuntu-latest (26.04) has no Python 3.9 builds.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_tests.py --durations=15

  fuzz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: toml_relaxed
            corpus: tests/fuzz/corpus
            max_len: 4096
            timeout: 5
          - target: database
            corpus: tests/fuzz/database_corpus
            max_len: 512
            timeout: 5
          - target: results
            corpus: tests/fuzz/results_corpus
            max_len: 512
            timeout: 5
          - target: finalization
            corpus: tests/fuzz/finalization_corpus
            max_len: 128
            timeout: 5
          - target: disk_finalization
            corpus: tests/fuzz/disk_finalization_corpus
            max_len: 64
            timeout: 15
          - target: suite_finalization
            corpus: tests/fuzz/suite_finalization_corpus
            max_len: 64
            timeout: 15
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - name: Fuzz ${{ matrix.target }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .fuzz-work/corpus .fuzz-work/artifacts
          cp ${{ matrix.corpus }}/* .fuzz-work/corpus/
          python -m tests.fuzz.${{ matrix.target }} .fuzz-work/corpus -max_total_time=30 -max_len=${{ matrix.max_len }} -timeout=${{ matrix.timeout }} -artifact_prefix=.fuzz-work/artifacts/ 2>&1 | tee .fuzz-work/fuzz.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-fuzz-failure-${{ matrix.target }}
          path: .fuzz-work/
          include-hidden-files: true
          if-no-files-found: ignore

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_static.py

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -r requirements.txt
      - run: python scripts/docgen/build_all.py --skip-pdf

  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel build
      - run: python -m build
      - name: Smoke install wheel
        run: |
          python -m venv /tmp/colosseum-core-wheel
          /tmp/colosseum-core-wheel/bin/pip install dist/*.whl
          /tmp/colosseum-core-wheel/bin/python -c "import colosseum; print(colosseum.__version__)"
          /tmp/colosseum-core-wheel/bin/colosseum --help

  smoke-frozen-executable:
    name: frozen executable smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core, the probe plugin, and test tools
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install tests/fixtures/plugins/colosseum_contract_probe --no-deps
      - name: Freeze and run the probe contract
        run: |
          python -m colosseum.tools.build_executable
          export COLOSSEUM_FROZEN_EXECUTABLE="$PWD/dist/colosseum/colosseum"
          python -m pytest tests/e2e/test_plugin_contract.py::test_real_frozen_plugin_contract -q -p no:cacheprovider

  regression:
    name: regression (ubuntu, py3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip setuptools wheel
      - run: python -m pip install -r requirements.txt
      - run: python tests/regression/run_soak_sim.py --count 5
      - run: python tests/regression/run_soak_inprocess.py --repeat 50
      - run: python tests/regression/run_docgen_check.py --skip-pdf
