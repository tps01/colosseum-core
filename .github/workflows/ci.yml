name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[test,plot]"
      - name: Run tiers 1-3
        run: python scripts/run_tests.py

  visa-sim:
    name: pytest visa_sim (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[test]"
      - name: PyVISA-sim tests
        run: python -m pytest -m visa_sim -q

  docgen:
    name: documentation pdf artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[docs,test]"
      - name: Install LaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
      - name: Build documentation (HTML + PDF)
        run: python scripts/docgen/build_all.py
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: colosseum-docs-pdf
          path: build/docgen/site/latex/*.pdf

  static-analysis:
    name: static analysis (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[static]"
      - name: Static analysis
        run: python scripts/run_static.py

  packaging:
    name: packaging smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: python -m pip install -U pip setuptools wheel build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke install wheel in fresh venv
        run: |
          python -m venv /tmp/colosseum-packaging-venv
          WHEEL=$(ls dist/*.whl)
          /tmp/colosseum-packaging-venv/bin/pip install "${WHEEL}[bench]"
          /tmp/colosseum-packaging-venv/bin/python -c "import pyvisa, paramiko, customtkinter"
          /tmp/colosseum-packaging-venv/bin/colosseum --help

  offline-install:
    name: offline bundle smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project for packaging script
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e .
      - name: Offline bundle regression
        run: python tests/regression/run_offline_install_check.py
