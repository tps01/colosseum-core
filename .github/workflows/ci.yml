name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Job timing summary header
        if: runner.os == 'Linux'
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Job timing summary header
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"## Job timing (${{ job.name }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8'
      - name: Install
        if: runner.os == 'Linux'
        uses: ./.github/actions/step-timer
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[test,gui]" -e "../colosseum-shared[ssh,test]" -e "../colosseum-host[test]" -e "../colosseum-equipment[test,plot]"
      - name: Install
        if: runner.os == 'Windows'
        uses: ./.github/actions/step-timer-pwsh
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel; python -m pip install -e ".[test,gui]" -e "../colosseum-shared[ssh,test]" -e "../colosseum-host[test]" -e "../colosseum-equipment[test,plot]"
      - name: Run tiers 1-3
        if: runner.os == 'Linux'
        uses: ./.github/actions/step-timer
        with:
          label: Run tiers 1-3
          command: python scripts/run_tests.py --durations=15
      - name: Run tiers 1-3
        if: runner.os == 'Windows'
        uses: ./.github/actions/step-timer-pwsh
        with:
          label: Run tiers 1-3
          command: python scripts/run_tests.py --durations=15

  visa-sim:
    name: pytest visa_sim (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Job timing summary header
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Install
        uses: ./.github/actions/step-timer
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[test]" -e "../colosseum-shared[ssh,test]" -e "../colosseum-host[test]" -e "../colosseum-equipment[test]"
      - name: PyVISA-sim tests
        uses: ./.github/actions/step-timer
        with:
          label: PyVISA-sim tests
          command: python -m pytest -m visa_sim -q

  docgen:
    name: documentation pdf artifact
    runs-on: ubuntu-latest
    env:
      COLOSSEUM_CI_TIMING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Job timing summary header
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Install
        uses: ./.github/actions/step-timer
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[docs,test]"
      - name: Cache LaTeX apt archives
        uses: actions/cache@v5
        with:
          path: .cache/apt/archives
          key: latex-ubuntu-${{ hashFiles('.github/workflows/ci.yml') }}-v2
          restore-keys: latex-ubuntu-
      - name: Install LaTeX toolchain
        uses: ./.github/actions/step-timer
        with:
          label: Install LaTeX toolchain
          command: |
            mkdir -p "$PWD/.cache/apt/archives/partial"
            sudo apt-get update
            sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra
            sudo chown -R "$USER":"$USER" "$PWD/.cache/apt"
            rm -rf "$PWD/.cache/apt/archives/partial"
      - name: Docgen staging
        uses: ./.github/actions/step-timer
        with:
          label: Docgen staging
          command: python scripts/docgen/build_all.py --stage-only
      - name: Docgen HTML
        uses: ./.github/actions/step-timer
        with:
          label: Docgen HTML
          command: python scripts/docgen/build_all.py --html-only
      - name: Docgen PDF
        uses: ./.github/actions/step-timer
        with:
          label: Docgen PDF
          command: python scripts/docgen/build_all.py --pdf-only
      - name: Docgen content checks
        uses: ./.github/actions/step-timer
        with:
          label: Docgen content checks
          command: python tests/regression/run_docgen_check.py --verify-only
      - uses: actions/upload-artifact@v7
        with:
          name: colosseum-docs-pdf
          path: build/docgen/site/latex/*.pdf
          if-no-files-found: error

  static-analysis:
    name: static analysis (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Job timing summary header
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Install
        uses: ./.github/actions/step-timer
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[static]"
      - name: Static analysis
        uses: ./.github/actions/step-timer
        with:
          label: Static analysis
          command: python scripts/run_static.py

  packaging:
    name: packaging smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Job timing summary header
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Install build tooling
        uses: ./.github/actions/step-timer
        with:
          label: Install build tooling
          command: python -m pip install -U pip setuptools wheel build
      - name: Build sdist and wheel
        uses: ./.github/actions/step-timer
        with:
          label: Build sdist and wheel
          command: python -m build
      - name: Smoke install wheel in fresh venv
        uses: ./.github/actions/step-timer
        with:
          label: Smoke install wheel in fresh venv
          command: |
            python -m venv /tmp/colosseum-packaging-venv
            WHEEL=$(ls dist/*.whl)
            /tmp/colosseum-packaging-venv/bin/pip install "${WHEEL}[bench]"
            /tmp/colosseum-packaging-venv/bin/python -c "import pyvisa, paramiko, customtkinter"
            /tmp/colosseum-packaging-venv/bin/colosseum --help

  soak-sim:
    name: sim soak (py3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Job timing summary header
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Install
        uses: ./.github/actions/step-timer
        with:
          label: Install
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[test]" -e "../colosseum-shared[ssh,test]" -e "../colosseum-host[test]" -e "../colosseum-equipment[test]"
      - name: Sim soak regression
        uses: ./.github/actions/step-timer
        with:
          label: Sim soak regression
          command: python tests/regression/run_soak_sim.py --count 5

  offline-install:
    name: offline bundle smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      COLOSSEUM_CI_TIMING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Job timing summary header
        if: runner.os == 'Linux'
        run: 'echo "## Job timing (${{ job.name }})" >> "$GITHUB_STEP_SUMMARY"'
      - name: Job timing summary header
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"## Job timing (${{ job.name }})" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8'
      - name: Install project for packaging script
        if: runner.os == 'Linux'
        uses: ./.github/actions/step-timer
        with:
          label: Install project for packaging script
          command: python -m pip install -U pip setuptools wheel && python -m pip install -e .
      - name: Install project for packaging script
        if: runner.os == 'Windows'
        uses: ./.github/actions/step-timer-pwsh
        with:
          label: Install project for packaging script
          command: python -m pip install -U pip setuptools wheel; python -m pip install -e .
      - name: Offline bundle regression
        if: runner.os == 'Linux'
        uses: ./.github/actions/step-timer
        with:
          label: Offline bundle regression
          command: python tests/regression/run_offline_install_check.py
      - name: Offline bundle regression
        if: runner.os == 'Windows'
        uses: ./.github/actions/step-timer-pwsh
        with:
          label: Offline bundle regression
          command: python tests/regression/run_offline_install_check.py
