# Advisory Cosmic Ray mutation run (single target). Non-blocking; artifacts for agent review.
name: Mutation nightly

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  mutation:
    name: cosmic-ray (aggregation)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install mutation extra
        run: python -m pip install -U pip setuptools wheel && python -m pip install -e ".[mutation]"
      - name: Run Cosmic Ray (single target)
        run: >
          python tests/regression/run_mutation.py --run
          --target colosseum/results/aggregation.py
      - name: Verify mutation reports
        if: always()
        run: >
          python tests/regression/run_mutation.py --verify-only
          --target colosseum/results/aggregation.py
      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports
          path: build/mutation/
          if-no-files-found: ignore
